name: WML Screener

# 장 마감 후 전 종목 WML 스크리닝 → 결과를 wml-data 브랜치에 커밋.
# 1순위 실행 경로: 장 마감 봇이 workflow_dispatch로 직접 실행하고 끝날 때까지 기다린다.
# 예비 경로: 평일 15:52 KST 예약 실행 (GitHub 예약 실행은 수십 분 늦어질 수 있음).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "테스트용: 앞에서부터 N종목만 (0 = 전체)"
        required: false
        default: "0"
  schedule:
    - cron: "40 6 * * 1-5"   # UTC 06:52 = KST 15:52

permissions:
  contents: write

concurrency:
  group: wml-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_PAPER: ${{ vars.KIS_PAPER || 'false' }}
      KIS_RPS: ${{ vars.KIS_RPS || '' }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/wml/requirements.txt

      - run: pip install -r scripts/wml/requirements.txt

      - name: Unit tests (네트워크 없이 지표·파이프라인 검증)
        run: |
          python scripts/wml/test_indicators.py
          python scripts/wml/test_offline_pipeline.py

      - name: Restore OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: wml-ohlcv-${{ github.run_id }}
          restore-keys: wml-ohlcv-

      - name: Run screener
        id: run
        run: |
          set +e
          python scripts/wml/screener.py --out out --cache cache --require-today --limit "${{ github.event.inputs.limit || '0' }}"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Save OHLCV cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: wml-ohlcv-${{ github.run_id }}

      - name: Publish to wml-data branch
        if: always() && (steps.run.outputs.exit == '0' || steps.run.outputs.exit == '2' || steps.run.outputs.exit == '1')
        run: |
          set -e
          test -f out/latest.json || { echo "결과 파일 없음"; exit 1; }
          git config --global user.name "wml-screener"
          git config --global user.email "wml-screener@users.noreply.github.com"
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REPO_URL" wml-data >/dev/null 2>&1; then
            git clone --depth 1 --branch wml-data --single-branch "$REPO_URL" pub
          else
            mkdir pub && cd pub && git init -q && git checkout -q -b wml-data && git remote add origin "$REPO_URL" && cd ..
          fi
          mkdir -p pub/wml/archive
          rm -f pub/wml/latest.md pub/wml/metrics.csv   # 실패 시 지난 결과가 최신처럼 남지 않게
          cp out/latest.json pub/wml/
          cp out/latest.md pub/wml/ 2>/dev/null || true
          cp out/metrics.csv pub/wml/ 2>/dev/null || true
          cp out/archive/*.json pub/wml/archive/ 2>/dev/null || true
          cd pub
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          AS_OF=$(python -c "import json;print(json.load(open('wml/latest.json')).get('as_of','unknown'))")
          STATUS=$(python -c "import json;print(json.load(open('wml/latest.json')).get('status'))")
          git commit -q -m "WML screener ${AS_OF} (${STATUS})"
          git push -q origin wml-data

      - name: Holiday skip
        if: steps.run.outputs.exit == '3'
        run: echo "휴장일 — 결과를 갱신하지 않았습니다."

      - name: Fail if screener failed
        if: steps.run.outputs.exit != '0' && steps.run.outputs.exit != '3'
        run: |
          echo "스크리너 종료 코드 ${{ steps.run.outputs.exit }} (1=연결·유니버스 실패, 2=조회 실패 10% 초과 등 불완전)"
          exit 1
