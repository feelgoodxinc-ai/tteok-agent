name: Daily Market Report

# ⚠️ 예약 실행은 Claude 구독 예약(Routines, routines/*.md)으로 이전했습니다 — API 크레딧 미사용.
# 이 워크플로는 API 크레딧으로 돌리는 비상용 수동 실행만 남겨둡니다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행할 리포트'
        type: choice
        options: [morning, close]
        default: morning
      force:
        description: '휴장일에도 실행'
        type: boolean
        default: true

concurrency:
  group: daily-report-${{ github.event.schedule || inputs.mode }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          INVEST_PROFILE: ${{ vars.INVEST_PROFILE }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            [ "${{ inputs.force }}" = "true" ] && FLAGS="--force"
          elif [ "${{ github.event.schedule }}" = "30 22 * * 0-4" ]; then
            MODE=morning
          else
            MODE=close
          fi
          node scripts/daily-report.mjs "$MODE" $FLAGS
