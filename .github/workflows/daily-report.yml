name: Daily Market Report

# GitHub Actions cron은 UTC 기준이며 혼잡 시 5~20분 지연될 수 있어, 도착 시각을 감안해 일찍 시작합니다.
#   모닝 브리핑: 07:30 KST 시작 → 약 8시 도착  (UTC 22:30, 전날 일~목)
#   장 마감 분석: 15:45 KST 시작 → 약 16시 도착 (UTC 06:45, 월~금)
# 휴장일(주말·scripts/krx-holidays.json)은 스크립트가 자동으로 건너뜁니다.
on:
  schedule:
    - cron: '30 22 * * 0-4'
    - cron: '45 6 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행할 리포트'
        type: choice
        options: [morning, close]
        default: morning
      force:
        description: '휴장일에도 실행'
        type: boolean
        default: true

concurrency:
  group: daily-report-${{ github.event.schedule || inputs.mode }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          INVEST_PROFILE: ${{ vars.INVEST_PROFILE }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            [ "${{ inputs.force }}" = "true" ] && FLAGS="--force"
          elif [ "${{ github.event.schedule }}" = "30 22 * * 0-4" ]; then
            MODE=morning
          else
            MODE=close
          fi
          node scripts/daily-report.mjs "$MODE" $FLAGS
