name: Market Recap Data

# 시황정리봇용 데이터 수집 (한국투자증권 Open API, 조회 전용)
# 대상: 상한가 전 종목 + 거래대금 1,000억 원 이상 중 상위 100개 종목
# 결과: recap-data 브랜치의 recap/latest.json · latest.md · archive/YYYYMMDD.json
# 투자자별 데이터는 장 종료 후 확정되므로 평일 17:20 KST에 실행 (예약 실행은 늦어질 수 있음)
on:
  schedule:
    - cron: "20 8 * * 1-5"   # UTC 08:20 = KST 17:20
  workflow_dispatch:
    inputs:
      limit:
        description: "테스트용: 현재가 스윕을 앞에서부터 N종목만 (0 = 전체)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: market-recap
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_PAPER: ${{ vars.KIS_PAPER || 'false' }}
      KIS_RPS: ${{ vars.KIS_RPS || '' }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/wml/requirements.txt

      - run: pip install -r scripts/wml/requirements.txt

      - name: Unit tests
        run: python scripts/recap/test_collect.py

      - name: Collect
        id: run
        run: |
          set +e
          python scripts/recap/collect.py --out out/recap --require-today --limit "${{ github.event.inputs.limit || '0' }}"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Publish to recap-data branch
        if: always() && (steps.run.outputs.exit == '0' || steps.run.outputs.exit == '1' || steps.run.outputs.exit == '2')
        run: |
          set -e
          test -f out/recap/latest.json || { echo "결과 파일 없음"; exit 1; }
          git config --global user.name "market-recap"
          git config --global user.email "market-recap@users.noreply.github.com"
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REPO_URL" recap-data >/dev/null 2>&1; then
            git clone --depth 1 --branch recap-data --single-branch "$REPO_URL" pub
          else
            mkdir pub && cd pub && git init -q && git checkout -q -b recap-data && git remote add origin "$REPO_URL" && cd ..
          fi
          mkdir -p pub/recap/archive
          rm -f pub/recap/latest.md
          cp out/recap/latest.json pub/recap/
          cp out/recap/latest.md pub/recap/ 2>/dev/null || true
          cp out/recap/archive/*.json pub/recap/archive/ 2>/dev/null || true
          cd pub
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          AS_OF=$(python -c "import json;print(json.load(open('recap/latest.json')).get('as_of','unknown'))")
          STATUS=$(python -c "import json;print(json.load(open('recap/latest.json')).get('status'))")
          git commit -q -m "Market recap ${AS_OF} (${STATUS})"
          git push -q origin recap-data

      - name: Holiday skip
        if: steps.run.outputs.exit == '3'
        run: echo "휴장일 — 갱신하지 않았습니다."

      - name: Fail if collector failed
        if: steps.run.outputs.exit != '0' && steps.run.outputs.exit != '3'
        run: |
          echo "수집기 종료 코드 ${{ steps.run.outputs.exit }} (1=연결 실패, 2=일부 실패)"
          exit 1
